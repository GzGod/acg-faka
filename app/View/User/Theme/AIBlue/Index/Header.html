<!DOCTYPE html>
<html lang="#{lang_code()}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="keywords" content="#{$config.keywords}"/>
<meta name="description" content="#{$config.description}"/>
<link href="#{$favicon}?v=#{$app.version}" rel="icon">
<title>#{$title} - #{$config.shop_name}</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
#{js("/assets/common/js/ready.js")}
#{index_var()}
<!--start::HOOK-->
#{hook(\App\Consts\Hook::USER_GLOBAL_VIEW_HEADER)}
#{hook(\App\Consts\Hook::USER_VIEW_INDEX_HEADER)}
<!--end::HOOK-->
<style>
:root{
  --bg:#080C14;--bg2:#060A10;--surface:#0E1520;--raised:#121D2E;
  --border:#1A2840;--border-s:#131F33;
  --text:#F0F4FF;--muted:#6B82A0;--muted2:#3D5270;
  --blue:#3B82F6;--blue2:#60A5FA;--blue3:#93C5FD;
  --cyan:#06B6D4;--cyan2:#22D3EE;
  --ok:#22C55E;--ok2:#4ADE80;--warn:#F59E0B;--danger:#EF4444;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{background:var(--bg);scroll-behavior:smooth;}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;background-image:radial-gradient(ellipse 80% 40% at 50% 0%,rgba(59,130,246,.08),transparent),radial-gradient(ellipse 40% 40% at 10% 60%,rgba(6,182,212,.05),transparent);}
h1,h2,h3,h4,.display{font-family:'Space Grotesk',sans-serif;}
a{text-decoration:none;color:inherit;}
button,input,select,textarea{font-family:inherit;}
.card{background:var(--surface);border:1px solid var(--border-s);border-radius:12px;}
.btn-blue{background:linear-gradient(135deg,#2563EB,#1D4ED8);color:#fff;border:none;border-radius:9px;padding:.6rem 1.4rem;font-weight:600;cursor:pointer;transition:filter .15s,box-shadow .15s;display:inline-flex;align-items:center;gap:.4rem;}
.btn-blue:hover{filter:brightness(1.1);box-shadow:0 0 0 1px rgba(59,130,246,.5),0 6px 20px -6px rgba(37,99,235,.5);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:9px;padding:.55rem 1.1rem;font-weight:500;cursor:pointer;transition:border-color .15s;display:inline-flex;align-items:center;gap:.4rem;}
.btn-ghost:hover{border-color:var(--blue2);}
.badge{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .6rem;border-radius:6px;font-size:.72rem;font-weight:600;white-space:nowrap;}
.badge-ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:var(--ok2);}
.badge-blue{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);color:var(--blue2);}
.badge-muted{background:rgba(255,255,255,.05);border:1px solid var(--border-s);color:var(--muted);}
.badge-warn{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:#FCD34D;}
.chip-pill{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.25);color:var(--blue2);border-radius:9999px;padding:.3rem 1rem;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;}
.chip-pill:hover,.chip-pill.active{background:rgba(59,130,246,.2);border-color:rgba(59,130,246,.5);color:#fff;}
.chip-pill.inactive{background:rgba(255,255,255,.03);border-color:var(--border-s);color:var(--muted2);cursor:not-allowed;}
input.acg-input{background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:.65rem 1rem;width:100%;outline:none;transition:border-color .2s;}
input.acg-input:focus{border-color:rgba(59,130,246,.6);}
select.acg-input{background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:.65rem 1rem;width:100%;outline:none;}
.price-tag{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--text);}
.sku-btn{background:rgba(255,255,255,.05);border:1px solid var(--border-s);color:var(--muted);border-radius:8px;padding:.4rem .9rem;font-size:.82rem;cursor:pointer;transition:all .15s;white-space:nowrap;}
.sku-btn:hover,.sku-btn.is-primary{background:rgba(59,130,246,.15);border-color:rgba(59,130,246,.45);color:#fff;}
.reveal{opacity:0;transform:translateY(10px);transition:opacity .45s ease,transform .45s ease;}
.reveal.in{opacity:1;transform:none;}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none;}}
:focus-visible{outline:2px solid var(--blue2);outline-offset:2px;border-radius:6px;}
::selection{background:rgba(59,130,246,.3);color:#fff;}
::-webkit-scrollbar{width:7px;}::-webkit-scrollbar-track{background:var(--bg2);}::-webkit-scrollbar-thumb{background:#1A2840;border-radius:5px;}
</style>
</head>
<body>

<!-- ── NAV ─────────────────────────────────────────────────────── -->
<header class="fixed top-0 inset-x-0 z-50" id="site-nav">
  <nav class="mx-3 mt-3 flex items-center gap-3 px-4 py-2.5 rounded-2xl"
       style="background:rgba(6,10,16,.92);border:1px solid rgba(26,40,64,.9);backdrop-filter:blur(20px);">
    <a href="/" class="flex items-center gap-2 mr-2 flex-shrink-0">
      <img src="#{$favicon}" alt="logo" class="w-7 h-7 rounded-lg">
      <span style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.92rem;">#{$config.shop_name}</span>
    </a>
    <a href="/" class="hidden md:block text-sm font-medium" style="color:var(--muted);transition:color .15s;" onmouseover="this.style.color='#F0F4FF'" onmouseout="this.style.color='var(--muted)'">全部商品</a>
    <a href="/user/index/query" class="hidden md:block text-sm font-medium" style="color:var(--muted);transition:color .15s;" onmouseover="this.style.color='#F0F4FF'" onmouseout="this.style.color='var(--muted)'">查询订单</a>
    #{foreach user_header_nav() as $nav}
    <a href="#{$nav.url}" target="#{$nav.target}" class="hidden md:block text-sm font-medium" style="color:var(--muted);transition:color .15s;" onmouseover="this.style.color='#F0F4FF'" onmouseout="this.style.color='var(--muted)'">#{$nav.name}</a>
    #{/foreach}
    <div class="flex-1"></div>
    #{if $user}
    <span class="text-sm" style="color:var(--muted);">#{$user.username}</span>
    <a href="/user/authentication/logout" class="btn-ghost px-3 py-1.5 text-xs">退出</a>
    #{else}
    <a href="/user/authentication/login" class="btn-ghost px-3 py-1.5 text-xs">登录</a>
    <a href="/user/authentication/register" class="btn-blue px-3 py-1.5 text-xs">注册</a>
    #{/if}
  </nav>
</header>
<div style="height:64px;"></div>
<script>
window.addEventListener('scroll',function(){
  var n=document.getElementById('site-nav')&&document.getElementById('site-nav').firstElementChild;
  if(n)n.style.background=window.scrollY>40?'rgba(4,7,12,.97)':'rgba(6,10,16,.92)';
},{passive:true});
</script>
<div id="pjax-container">
